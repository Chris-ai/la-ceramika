services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: la_ceramica
      POSTGRES_USER: la_ceramica
      POSTGRES_PASSWORD: la_ceramica
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U la_ceramica -d la_ceramica"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
